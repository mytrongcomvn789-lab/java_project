name: backend-ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start MinIO for integration tests
        run: |
          AK="ci$(openssl rand -hex 4)"; SK="$(openssl rand -hex 16)"
          echo "::add-mask::$SK"
          echo "MINIO_TEST_ENDPOINT=http://localhost:9000" >> "$GITHUB_ENV"
          echo "MINIO_TEST_ACCESS_KEY=$AK" >> "$GITHUB_ENV"
          echo "MINIO_TEST_SECRET_KEY=$SK" >> "$GITHUB_ENV"
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$AK" -e MINIO_ROOT_PASSWORD="$SK" \
            minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/ready && break; sleep 1; done
      - name: Build and test backend
        run: mvn -B -f backend/pom.xml verify
      - name: Build and test backend
        run: mvn -B -f backend/pom.xml verify
