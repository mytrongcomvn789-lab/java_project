services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartdrone-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 5s
      retries: 30

  sqlserver-init:
    image: mcr.microsoft.com/mssql-tools18:latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for attempt in {1..60}; do
          if sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -b \
            -Q "IF DB_ID(N'smartdrone') IS NULL CREATE DATABASE [smartdrone]"; then
            exit 0
          fi
          sleep 2
        done
        exit 1

  minio:
    # Silo: bản fork MinIO còn được duy trì (minio/minio và quay.io/minio/minio không còn tải được)
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: smartdrone-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Đặt MINIO_ROOT_USER trong file .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Đặt MINIO_ROOT_PASSWORD trong file .env}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
      MINIO_UPDATE: "off"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mssqldata:
  miniodata:
