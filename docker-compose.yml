services:
  postgres:
    image: postgres:16
    container_name: smartdrone-db
    environment:
      POSTGRES_DB: smartdrone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    # Silo: bản fork MinIO còn được duy trì (minio/minio và quay.io/minio/minio không còn tải được)
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    container_name: smartdrone-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Đặt MINIO_ROOT_USER trong file .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Đặt MINIO_ROOT_PASSWORD trong file .env}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
      MINIO_UPDATE: "off"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  miniodata:
