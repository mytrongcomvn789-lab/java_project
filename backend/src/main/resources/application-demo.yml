# Bật dữ liệu demo cho dev: thêm profile "demo" khi chạy backend, ví dụ
#   mvn spring-boot:run "-Dspring-boot.run.profiles=sqlserver,demo"
# Không dùng ở môi trường thật (tài khoản demo có mật khẩu công khai).
app:
  seed:
    demo: true
smartdrone:
  charging:
    simulate-heartbeat: true # thiết bị sạc giả lập gửi heartbeat mỗi 30 giây (chưa có phần cứng thật)
  dispatch:
    auto-sweep: true # định kỳ 30 giây gán drone cho đơn đang chờ và tính lại kế hoạch
