server:
  port: 5000
  servlet:
    context-path: /api
  error:
    include-message: always # để web đọc được trường "message" khi có lỗi

spring:
  application:
    name: smartdrone-backend
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=smartdrone;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:${MSSQL_SA_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # tự tạo/cập nhật bảng khi dev (sau này có thể chuyển sang Flyway)
    show-sql: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    key: ${APP_JWT_KEY:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY_32+} # chạy thật: đặt biến môi trường APP_JWT_KEY
    issuer: SmartDrone
    audience: SmartDroneClients
    access-token-minutes: 15
    refresh-token-days: 7

  api-keys:
    default-rate-limit-per-minute: 60 # dùng khi POST /v1/admin/api-keys không truyền rateLimitPerMinute

  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}} # host mà TRÌNH DUYỆT truy cập được
    access-key: ${MINIO_ACCESS_KEY:} # không có giá trị mặc định: không commit secret
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:smartdrone-files}
    region: us-east-1
    auto-create-bucket: true
    max-file-size-bytes: 5242880 # 5 MiB (đề xuất, chờ nhóm chốt)
    upload-ticket-ttl: PT5M # 5 phút (đề xuất, chờ nhóm chốt)
    download-link-ttl: PT5M
    allowed-content-types: image/jpeg,image/png,image/webp
    max-pending-per-user: 20
    pending-grace: PT1H
    unattached-retention: PT24H

  order-package:
    max-weight-grams: 5000
    max-length-cm: 50
    max-width-cm: 50
    max-height-cm: 50
    min-photos: 0
    max-photos: 3

  schedule:
    slot-minutes: 30 # độ dài một slot; hoạt động 24/24 nên phải chia hết 1440 phút
    min-lead-minutes: 30 # lịch phải bắt đầu sau hiện tại ít nhất ngần này phút
    max-days-ahead: 7 # đặt xa nhất bao nhiêu ngày
    max-attempts: 3 # 4.8: tối đa số lần giao một đơn (kể cả lần đầu); quá số này chỉ còn hoàn hàng
    
  pickup: # 4.7: mã nhận hàng OTP/QR
    secret: ${APP_PICKUP_SECRET:CHANGE_ME_PICKUP_SECRET_AT_LEAST_32_CHARS} # chạy thật: đặt biến APP_PICKUP_SECRET
    challenge-ttl: PT30M
    max-failed-attempts: 5
    otp-digits: 6

smartdrone:
  ai: # 7.1: AI Service. Mọi giá trị hạn mức là ƯỚC LƯỢNG thấp hơn gói miễn phí Gemini; đối chiếu trang rate limit trong AI Studio.
    provider: AUTO # AUTO: có key -> Gemini; không key -> Mock (chỉ profile dev/test/h2/demo) hoặc Disabled
    fallback-enabled: false # true: khi provider lỗi/không cấu hình trả degraded=true thay vì lỗi 5xx
    send-personal-data: false # false: che email/SĐT/dãy số dài trước khi gửi ra ngoài (khuyến nghị cho gói miễn phí)
    max-chat-message-chars: 1000
    gemini:
      api-key: ${SMARTDRONE_AI_GEMINI_API_KEY:} # chỉ đọc từ biến môi trường; KHÔNG ghi khóa vào file này
      model: gemini-2.5-flash-lite # CẦN KIỂM TRA LẠI: Google đổi tên/ngừng model thường xuyên
      base-url: https://generativelanguage.googleapis.com
      api-version: v1beta
      connect-timeout: PT3S
      read-timeout: PT15S
      max-retries: 2 # tối đa 2
      max-output-tokens: 1024
    rate-limit:
      per-user-per-minute: 5
      global-per-minute: 10
    budget:
      user-tokens-per-day: 20000
      global-tokens-per-day: 200000
    breaker:
      failure-threshold: 5
      open-duration: PT30S

logging:
  level:
    root: INFO
  pattern:
    # In traceId (RequestLoggingFilter đặt vào MDC) vào MỌI dòng log của request,
    # để từ traceId trong JSON lỗi / header X-Trace-Id tra ra toàn bộ log liên quan.
    correlation: "[%X{traceId:-}] "
  file:
    name: ${LOG_FILE:logs/smartdrone-backend.log} # ngoài console còn ghi ra file
  logback:
    rollingpolicy: # xoay vòng file: mỗi ngày hoặc khi quá 10MB, giữ 14 ngày, tối đa 1GB
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 1GB
